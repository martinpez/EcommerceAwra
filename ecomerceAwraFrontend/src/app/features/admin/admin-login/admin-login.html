<main class="login">
  <form class="login__form" [formGroup]="formulario" (ngSubmit)="entrar()">
    <div class="login__marca">
      <span class="login__nombre">AWRA</span>
      <span class="login__tag">panel</span>
    </div>

    <p class="login__intro">Acceso para administrar el catálogo y el contenido.</p>

    @if (error(); as mensaje) {
      <p class="login__error" role="alert">{{ mensaje }}</p>
    }

    <label class="login__campo">
      <span>Usuario</span>
      <input type="text" formControlName="username" autocomplete="username" required />
    </label>

    <label class="login__campo">
      <span>Contraseña</span>
      <input type="password" formControlName="password" autocomplete="current-password" required />
    </label>

    <button type="submit" class="login__boton" [disabled]="cargando()">
      {{ cargando() ? 'Entrando…' : 'Entrar' }}
    </button>

    <a class="login__volver" routerLink="/">Volver a la web</a>
  </form>
</main>
