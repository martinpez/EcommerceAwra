<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>AWRA — Reflect the night.</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="AWRA: buzos reflectivos diseñados en Colombia para la noche, la moto y la ciudad."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Las fuentes se cargan sin bloquear el render: con `media="print"` el
      navegador las pide en segundo plano y las cambia a `all` cuando llegan.
      Mientras tanto se ve la fuente de reserva, y `display=swap` evita que el
      texto desaparezca. El <noscript> es para quien no tiene JavaScript.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Pirata+One&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Pirata+One&display=swap"
      />
    </noscript>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
