server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El backend acepta subidas de hasta 50 MB (multipart de 55 MB).
    client_max_body_size 55m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API: proxy hacia el backend por la red interna de Docker.
    #
    # Se resuelve el nombre en cada peticion (resolver de Docker) y se pasa la
    # URI original con $request_uri, para que el backend siga recibiendo /api/...
    # aunque el contenedor del backend se recree con otra IP.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8080;
        proxy_pass $backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # Assets con hash en el nombre: cache larga e inmutable.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpe?g|gif|webp|avif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El index no se cachea: es el que apunta a los bundles con hash nuevo.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: las rutas de Angular (/admin/..., /producto/...) vuelven al index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
