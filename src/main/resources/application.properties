spring.application.name=ecomerceAwra
spring.profiles.active=dev
spring.data.web.pageable.max-page-size=100
catalogo.etiqueta-agotado=Agotado

app.jwt.secret=${JWT_SECRET}
app.jwt.expiracion-minutos=120
app.cors.origenes=http://localhost:4200,http://127.0.0.1:4200
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.carpeta=ecommerce-awra
cloudinary.carpeta-sitio=${CLOUDINARY_CARPETA_SITIO:ecommerce-awra/sitio}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# El limite global es para los videos del sitio. Las imagenes validan su propio
# limite de 5 MB en el codigo (ValidacionArchivo).
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
